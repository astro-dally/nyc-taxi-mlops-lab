# App CD (S3): build linux/arm64 image, push to GHCR, blue-green deploy on app host.
#
# Separate from app.yaml (CI) because a workflow that triggers on pull_request must never
# contain a self-hosted runner job (security rule: fork PRs would run on your EC2 host).
#
# Blue-green primitives are provided by deploy/web.sh and deploy/compose.web.yaml.
# Traffic is switched atomically by Traefik once smoke tests on the idle colour pass.
name: app-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "contracts/**"
      - "deploy/compose.web.yaml"
      - "deploy/traefik/**"
      - "deploy/web.sh"
      - ".github/workflows/app.yaml"
      - ".github/workflows/app-deploy.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (deploy or rollback)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.tag }}
      prefix: ${{ steps.img.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: The app loads inside the image
        run: |
          docker run --rm \
            "${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}" \
            python -c "import rideapp.main; print('app imports ok')"

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    needs: image
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.image.outputs.tag }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to idle colour and switch
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare

          current=$(deploy/web.sh live)
          if [ "$current" = "blue" ]; then
            target="green"
            other="blue"
          else
            target="blue"
            other="green"
          fi
          echo "Current live colour: $current -> Deploying target: $target"

          other_tag=$(deploy/web.sh tag "$other")
          if [ "$other_tag" = "none" ]; then
            echo "Initial deployment: starting both blue and green with $IMAGE_TAG"
            export BLUE_TAG="$IMAGE_TAG"
            export GREEN_TAG="$IMAGE_TAG"
            docker compose -f deploy/compose.web.yaml pull app-blue app-green
            docker compose -f deploy/compose.web.yaml up -d --wait --remove-orphans app-blue app-green
          else
            if [ "$target" = "blue" ]; then
              export BLUE_TAG="$IMAGE_TAG"
              export GREEN_TAG="$other_tag"
            else
              export GREEN_TAG="$IMAGE_TAG"
              export BLUE_TAG="$other_tag"
            fi
            docker compose -f deploy/compose.web.yaml pull "app-$target"
            docker compose -f deploy/compose.web.yaml up -d --wait --no-deps "app-$target"
          fi

          echo "Smoke testing $target..."
          deploy/web.sh smoke "$target" "${{ github.sha }}"

          echo "Switching live traffic to $target..."
          deploy/web.sh switch "$target"

          echo "Deployment finished. Status:"
          deploy/web.sh status

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Switch to other colour
        run: |
          live=$(deploy/web.sh live)
          if [ "$live" = "blue" ]; then
            other="green"
          elif [ "$live" = "green" ]; then
            other="blue"
          else
            echo "Cannot rollback: no live colour (got '$live')" >&2
            exit 1
          fi
          other_tag=$(deploy/web.sh tag "$other")
          if [ "$other_tag" = "none" ]; then
            echo "Cannot rollback: $other has no image tag running" >&2
            exit 1
          fi
          echo "Current live is $live. Rolling back to $other (tag $other_tag)..."
          deploy/web.sh smoke "$other"
          deploy/web.sh switch "$other"
          echo "Rolled back to $other successfully!"
          deploy/web.sh status
