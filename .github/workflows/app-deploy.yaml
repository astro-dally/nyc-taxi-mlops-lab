# App CD (S0): build the linux/arm64 app image, push to GHCR, deploy on the app host.
#
# Separate from app.yaml (CI) because a workflow that triggers on pull_request must never
# contain a self-hosted runner job (security rule: fork PRs would run on your EC2 host).
#
# The self-hosted runner (label lab-app) authenticates to AWS via the EC2 instance profile
# (LabInstanceProfile / LabRole) — no static credentials needed.
name: app-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "contracts/**"
      - "deploy/compose.app.yaml"
      - "deploy/traefik/**"
      - ".github/workflows/app.yaml"
      - ".github/workflows/app-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.tag }}
      prefix: ${{ steps.img.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: The app loads inside the image
        run: |
          docker run --rm \
            "${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}" \
            python -c "import rideapp.main; print('app imports ok')"

  deploy:
    needs: image
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test /version
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 \
            http://127.0.0.1/version | tee /tmp/version.json
          echo
          grep -q "${{ github.sha }}" /tmp/version.json || \
            grep -q "${GITHUB_SHA::7}" /tmp/version.json
