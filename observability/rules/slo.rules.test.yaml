rule_files:
  - slo.rules.yaml

evaluation_interval: 1m

tests:
  # Test 1: Normal traffic followed by a transient spike should NOT fire the burn rate alert
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict", code="200"}'
        values: '0+100x60 6000 6100+100x20'
      - series: 'lab_http_requests_total{route="/predict", code="500"}'
        values: '0+0x60 50 50+0x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: PredictAvailabilityBurnRate
        exp_alerts: []
      - eval_time: 65m
        alertname: PredictAvailabilityBurnRate
        exp_alerts: []
      - eval_time: 75m
        alertname: PredictAvailabilityBurnRate
        exp_alerts: []

  # Test 2: A sustained outage (rapid burn) MUST fire the page alert
  - interval: 1m
    input_series:
      - series: 'lab_http_requests_total{route="/predict", code="200"}'
        values: '0+100x60 6000+0x30'
      - series: 'lab_http_requests_total{route="/predict", code="500"}'
        values: '0+0x60 0+100x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PredictAvailabilityBurnRate
        exp_alerts: []
      - eval_time: 70m
        alertname: PredictAvailabilityBurnRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Predict availability error budget is burning rapidly"
              description: "Predict 5xx error rate is consuming more than 14.4x the allowed budget over 1h and 5m windows."
